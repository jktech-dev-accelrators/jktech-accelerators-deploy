name: check-configs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate accelerator configs
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for config in accelerators/*/config.yml; do
            if [ ! -f "$config" ]; then
              continue
            fi
            found=1
            python3 scripts/read_config.py "$config"
          done
          if [ "$found" -eq 0 ]; then
            echo "No accelerator config files found."
            exit 1
          fi
